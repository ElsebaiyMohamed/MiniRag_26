services:

# PostgreSQL (pgvector)
  pgvector:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: pgvector
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql
    env_file:
      - ./envv/.env.postgres
    networks:
      - bakend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    env_files:
      - ./envv/.env.postgresexporter
    depends_on:
      - pgvector
    networks:
      - bakend
    restart: always

  # Qdrant
  qdrant:
    image: qdrant/qdrant:v1.19
    container_name: qdrant
    ports:
      - "6333:6333"
      - "5334:5334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - bakend
    restart: always
  
  # Promethues
  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - bakend
    command: 
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
  
  # Grafana
  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:var/lib/grafana
    env_files:
      - ./envv/.env.grafana
    networks:
      - bakend
    depends_on:
      - prometheus
    restart: always



networks:
  bakend:
volumes:
  pgvector_data:
  qdrant_data:
  prometheus_data:
  grafana_data:

