services:
  mongodb:
    image: mongo:noble
    container_name: mongodb
    ports:
      - "27007:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodata:/data/db
    networks:
      - bakend
    restart: always

networks:
  bakend:
volumes:
  mongodata:
