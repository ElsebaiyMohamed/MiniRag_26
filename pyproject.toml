[project]
name = "minirag-26"
version = "1.2.0"
description = "Question Answering System"
readme = "README.md"
requires-python = ">=3.13.14"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "cohere>=7.1.1",
    "fastapi>=0.141.1",
    "langchain-community>=0.4.2",
    "openai>=3.19.0",
    "prometheus-client>=0.26.0",
    "psycopg2>=2.9.13",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.53",
    "starlette>=1.6.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
