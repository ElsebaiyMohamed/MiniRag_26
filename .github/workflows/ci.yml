name: MiniRag CI

on:
  push:
    branches: [ master, "release/1.2.0" ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minirag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minirag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGVECTOR_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/minirag_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13.14"   # matches docker/minirag/DockerFile

      - name: Install dependencies
        run: uv sync --frozen

      - name: Configure test environment
        run: cp src/.env.example.app src/.env.app

      - name: Run tests
        env:
          COHERE_API_KEY: test-cohere-key
          OPENAI_API_KEY: test-openai-key
        run: uv run pytest tests/ -v --cov=src --cov-report=term-missing
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run ruff
        run: uvx ruff check tests/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare Compose environment
        run: |
          cp docker/envv/.env.example.app docker/envv/.env.app
          cp docker/envv/.env.example.postgres docker/envv/.env.postgres
          cp docker/envv/.env.example.postgresexporter docker/envv/.env.postgresexporter
          cp docker/envv/.env.example.grafana docker/envv/.env.grafana

      - name: Validate Docker Compose configuration
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Build Docker image
        run: |
          docker build \
            -f docker/minirag/DockerFile \
            -t minirag-26:ci \
            .