name: Nightly Release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Nightly
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13.14"

      - name: Build distributions
        run: uv build

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            echo "Updating existing nightly release..."

            # Replace existing distribution assets.
            gh release upload nightly dist/* --clobber

            # Move the rolling tag to the current dev commit.
            git tag -f nightly "$GITHUB_SHA"
            git push origin refs/tags/nightly --force
          else
            echo "Creating the first nightly release..."

            git tag nightly "$GITHUB_SHA"
            git push origin refs/tags/nightly

            gh release create nightly dist/* \
              --title "MiniRag_26 Nightly" \
              --notes "Rolling nightly build from the dev branch. Not a stable release." \
              --prerelease \
              --verify-tag
          fi
